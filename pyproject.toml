[project]
name = "rag-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mrajpurohit1912", email = "mrajpurohit1912@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "huggingface>=0.0.1",
    "huggingface-hub>=1.33.0",
    "langchain>=1.4.6",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[project.scripts]
rag-benchmark = "rag_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
